spring.application.name=backend

# =========================
# DATABASE - MySQL
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nhom8?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Explicit dialect for the MariaDB server used by some local installations.
# Override with DB_DIALECT if using MySQL instead.
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.open-in-view=false

# =========================
# SERVER
# =========================
server.port=${SERVER_PORT:8080}

# =========================
# UPLOADS
# =========================
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================
# JWT
# =========================
# Chạy local KHÔNG cần đặt JWT_SECRET: dùng khóa dev mặc định bên dưới (đủ >= 32 byte).
# Khi deploy thật PHẢI đặt biến môi trường JWT_SECRET riêng; profile "prod" sẽ từ chối khóa dev này.
app.security.jwt-secret=${JWT_SECRET:han-seoul-dev-only-secret-change-me-0123456789}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:900000}

# =========================
# CORS
# =========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# =========================
# ACTUATOR / APP INFO
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false
info.app.name=Han Seoul Restaurant
info.app.description=He thong quan ly nha hang Han Seoul
info.app.version=1.0.0

# =========================
# SWAGGER
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# =========================
# MOMO SANDBOX
# Dung cho local sandbox; khong commit key len Git.
# =========================
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.return-url=${MOMO_RETURN_URL:http://localhost:3000/thanh-toan/momo/ket-qua}
momo.ipn-url=${MOMO_IPN_URL:}
# Tuỳ chọn: momo.query-endpoint (mặc định suy ra từ endpoint), momo.partner-name, momo.store-id, momo.request-type (captureWallet)
